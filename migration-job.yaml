apiVersion: batch/v1
kind: Job
metadata:
  name: magazine-migration
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Fixing permissions ==="
              ls -la /app/
              chmod -R 755 /app/
              chown -R 33:33 /app/
              ls -la /app/artisan
          volumeMounts:
            - name: app-code
              mountPath: /app
      containers:
        - name: migration
          image: ghcr.io/kavik22/magazine-app:latest
          command:
            - sh
            - -c
            - |
              echo "=== Current directory ==="
              pwd
              ls -la

              echo "=== Looking for artisan ==="
              find / -name "artisan" 2>/dev/null

              echo "=== Checking /var/www ==="
              ls -la /var/www/

              echo "=== Running migrations ==="
              cd /var/www
              php artisan --version
              php artisan migrate --force
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "magazine"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: APP_KEY
              value: "base64:YOUR_APP_KEY_HERE"
          volumeMounts:
            - name: app-code
              mountPath: /var/www
      volumes:
        - name: app-code
          emptyDir: {}
